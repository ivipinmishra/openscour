services:
  searxng:
    # Pinned so an upstream release can't change behavior unannounced; update deliberately.
    image: searxng/searxng:2026.10.27-b5ed73fcb
    # Only reachable from this machine; the API reaches it over the compose network.
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/start.sh:/usr/local/bin/openscour-start.sh:ro
    # Adds SEARCH_PROXIES to SearXNG's settings, then runs the image's own entrypoint.
    entrypoint: ["/bin/sh", "/usr/local/bin/openscour-start.sh"]
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARCH_PROXIES=${SEARCH_PROXIES:-}
    cap_drop:
      - ALL
    cap_add:
      # The image's entrypoint switches to its own unprivileged user.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build: .
    # Bound to this machine only. To serve other machines, remove "127.0.0.1:"
    # and set API_KEYS (see "Deploying" in the README).
    ports:
      - "127.0.0.1:8000:8000"
    # Settings from .env or the shell (see .env.example). A name without a value
    # is passed only when it's set, so the server's own default applies otherwise.
    environment:
      - SEARXNG_URL=http://searxng:8080
      - API_KEYS
      - ANSWER_PROVIDER
      - ANSWER_MODEL
      - AWS_REGION
      - DUCKDUCKGO_FALLBACK
      - SEARCH_PROXIES
      - FETCH_TIMEOUT
      - FETCH_CONCURRENCY
      - EXTRACT_WORKERS
      - BASIC_FETCH_DEADLINE
      - MAX_PAGE_BYTES
      - MAX_PDF_BYTES
      - PDF_MAX_PAGES
      - CACHE_TTL_SECONDS
      - MAX_INFLIGHT_FETCHES
      - EXTRACT_MAX_TASKS_PER_CHILD
      - USER_AGENT
      - RESPECT_ROBOTS_TXT
      - ALLOW_PRIVATE_NETWORK_FETCHES
      - RATE_LIMIT_PER_MINUTE
      - DAILY_QUOTA_PER_KEY
      - TRUST_FORWARDED_FOR
    read_only: true
    tmpfs:
      # Extraction worker processes need a writable /tmp for their semaphores.
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - searxng
    restart: unless-stopped
