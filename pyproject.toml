[project]
name = "openscour"
version = "0.5.0"
description = "Self-hosted web search API for LLMs and agents that returns answer-first passages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ivipinmishra" }]
keywords = ["search", "web-search", "llm", "rag", "ai-agents", "mcp", "searxng", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# The client only needs httpx; the server's dependencies are the "server" extra.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "trafilatura>=1.12",
    "ddgs>=9.0",
    "anthropic[bedrock]>=0.60",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
]
mcp = ["mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/ivipinmishra/openscour"
Documentation = "https://github.com/ivipinmishra/openscour#readme"
Changelog = "https://github.com/ivipinmishra/openscour/blob/main/CHANGELOG.md"
Issues = "https://github.com/ivipinmishra/openscour/issues"

[project.scripts]
openscour-server = "openscour.server.main:run"
openscour-mcp = "openscour.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openscour"]
# Never ship local secrets that sit inside the package folder.
exclude = ["**/.env", "**/.env.*"]

[tool.hatch.build.targets.sdist]
# An explicit list, so nothing local (secrets, private notes) can end up on PyPI.
only-include = ["openscour", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["**/.env", "**/.env.*"]

[tool.uv]
# Developing here means working on both halves.
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "openscour[server,mcp]",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
# Code blocks in the README are written for reading, not formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pyflakes and pycodestyle errors, import order, likely bugs, and modern syntax.
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI declares dependencies as Depends(...) defaults, which is how it's meant to be used.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["openscour"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["trafilatura", "trafilatura.*", "ddgs", "ddgs.*"]
ignore_missing_imports = true
